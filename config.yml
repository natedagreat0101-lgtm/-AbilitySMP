config-version: 9

# ------------------------------------------------------------------
# Powers: right-click with a sword to use your power.
# Power items (nether stars): right-click one to gain that power.
# ------------------------------------------------------------------
flame:
  cooldown: 8
  fireball-yield: 2.0

# Speed is the starter power: idle Speed I, super = Speed III burst
speed:
  cooldown: 30
  idle-level: 1
  super-level: 3
  super-seconds: 8

shadow:
  cooldown: 12
  range: 25

thor:
  cooldown: 10
  range: 30

hunter:
  cooldown: 12
  range: 25
  pull-strength: 1.6
  pull-up: 0.25

stealer:
  cooldown: 20
  range: 20
  duration: 15

feather:
  cooldown: 10
  launch-strength: 2.3

healer:
  cooldown: 25

aqua:
  cooldown: 14
  speed: 0.8
  duration-ticks: 40

tank:
  cooldown: 15
  stun-seconds: 3

ghost:
  cooldown: 30
  range: 20
  wither-seconds: 3
  hearts-stolen: 4
  invisibility-duration-seconds: 10
  glow-radius: 30
  steal-duration: 300       # seconds until stolen hearts return (0 = until death/quit)
  min-hearts-left: 1
  max-extra-hearts: 10      # most extra hearts a Ghost can hold from stealing (0 = no limit)

# Vampire: latch onto the nearest enemy (sneak to let go), drain them with fake blood, wither them.
vampire:
  cooldown: 25
  range: 20
  wither-seconds: 4
  wither-amplifier: 0
  leech-seconds: 5
  leech-per-pulse: 1.0      # HP taken from the enemy and given to you, 2 pulses per second

# Void: idle Strength III. Super: wither + big damage to the nearest enemy.
void:
  cooldown: 40
  range: 25
  wither-seconds: 5
  wither-amplifier: 1
  damage-hearts: 7

# Teleporter: dash to the nearest enemy, freeze them, fling them back, damage them.
teleporter:
  cooldown: 30
  range: 30
  dash-speed: 2.0
  freeze-ticks: 20
  fling-distance: 20        # blocks (walls and obstacles shorten it)
  damage-hearts: 4

# ------------------------------------------------------------------
# Halloween powers (v8): Pumpkin, Witch, Skeleton, Spider, Scarecrow,
# Reaper, Candy, Phantom, Werewolf, Curse
# ------------------------------------------------------------------
pumpkin:
  cooldown: 18
  fireball-yield: 3.5

witch:
  cooldown: 25
  range: 10
  poison-seconds: 6

skeleton:
  cooldown: 16
  range: 30
  arrows: 8
  arrow-damage: 4.0         # 2 hearts per arrow

spider:
  cooldown: 20
  range: 20
  poison-seconds: 5
  web-seconds: 5

scarecrow:
  cooldown: 22
  range: 9
  fear-seconds: 6

reaper:
  cooldown: 20
  range: 25
  damage-hearts: 5
  heal-hearts: 2.5

candy:
  cooldown: 24
  buff-seconds: 10
  heal-hearts: 4

phantom:
  cooldown: 18
  dash-strength: 1.8
  range: 7
  damage-hearts: 2

werewolf:
  cooldown: 26
  buff-seconds: 12
  range: 10

curse:
  cooldown: 24
  range: 22
  curse-seconds: 8

# ------------------------------------------------------------------
# Chance weights used when someone rerolls their power:
# ------------------------------------------------------------------
drops:
  enabled: true
  flame: 0.20
  speed: 0.15
  tank: 0.03
  thor: 0.12
  shadow: 0.10
  healer: 0.08
  feather: 0.10
  stealer: 0.06
  aqua: 0.12
  hunter: 0.12
  ghost: 0.08
  vampire: 0.06
  teleporter: 0.04
  void: 0.05
  pumpkin: 0.07
  witch: 0.06
  skeleton: 0.07
  spider: 0.07
  scarecrow: 0.06
  reaper: 0.04
  candy: 0.08
  phantom: 0.06
  werewolf: 0.05
  curse: 0.05

# Reroll if the first power isn't the wanted one:
rerolling:
  enabled: true
  window-minutes: 10

# Potion-effect levels and idle settings:
passives:
  speed-level: 2
  thor-strength-level: 1
  stealer-haste-level: 1
  healer-regeneration-level: 2
  aqua-dolphins-grace-level: 1
  ghost-speed-level: 1
  teleporter-speed-level: 3
  void-strength-level: 3
  werewolf-speed-level: 1
  tank-extra-hearts: 4
  hunter-glow-radius: 30
  particles-enabled: true

# All enabled powers (delete to disable):
powers:
  enabled:
    - flame
    - speed
    - tank
    - thor
    - shadow
    - healer
    - feather
    - stealer
    - aqua
    - hunter
    - ghost
    - vampire
    - teleporter
    - void
    - pumpkin
    - witch
    - skeleton
    - spider
    - scarecrow
    - reaper
    - candy
    - phantom
    - werewolf
    - curse

# ------------------------------------------------------------------
# Who counts as an enemy for powers (targeting, glow, stun)
# ------------------------------------------------------------------
enemies:
  players: true
  hostile-mobs: true
  passive-mobs: false       # cows, pigs etc. (pets and villagers are never targeted)

# ------------------------------------------------------------------
# Reroll token: diamonds around a gold block. Right-click for a new random power.
# ------------------------------------------------------------------
reroll:
  recipe-enabled: true

# ------------------------------------------------------------------
# New player tutorial (/skip to skip, /tutorial to replay)
# ------------------------------------------------------------------
tutorial:
  enabled: true
  finish-reward: ["item:BREAD:8"]

# ------------------------------------------------------------------
# Admin panel (/panel): music tracks and Halloween events.
# Tracks are sound keys. Vanilla discs work out of the box. To use your own audio,
# add it to a resource pack (server.properties resource-pack=...) and put its sound key here,
# for example:  my-theme: "unbound:halloween_theme"
# Note: YouTube links can't be played by a server plugin.
# ------------------------------------------------------------------
music:
  tracks:
    disc-13: "minecraft:music_disc.13"
    disc-11: "minecraft:music_disc.11"
    cat: "minecraft:music_disc.cat"
    stal: "minecraft:music_disc.stal"
    pigstep: "minecraft:music_disc.pigstep"
    otherside: "minecraft:music_disc.otherside"
    disc-5: "minecraft:music_disc.5"
    blocks: "minecraft:music_disc.blocks"
    chirp: "minecraft:music_disc.chirp"
    far: "minecraft:music_disc.far"
    mall: "minecraft:music_disc.mall"
    mellohi: "minecraft:music_disc.mellohi"
    strad: "minecraft:music_disc.strad"
    wait: "minecraft:music_disc.wait"
    ward: "minecraft:music_disc.ward"
    creator: "minecraft:music_disc.creator"
    relic: "minecraft:music_disc.relic"
    cave-ambience: "minecraft:ambient.cave"

halloween:
  enabled: true      # false = portal, Haunted Forest mobs, boss and events are off. Ranks and progress stay.
  music: "minecraft:music_disc.13"
  music-length-seconds: 178
  curse-seconds: 60
  max-lanterns: 120
  lantern-interval-seconds: 5

# ------------------------------------------------------------------
# New players start with this power and a Power Activator sword
# ------------------------------------------------------------------
starter-power: speed

activator:
  required: true            # true = only the Power Activator sword uses powers, false = any sword

# ------------------------------------------------------------------
# Unbound Coins: earned from quests and playtime, spent at upgrade stations
# (an admin sets a station with /station add while looking at a block)
# ------------------------------------------------------------------
points:
  play-minutes: 25          # every 25 minutes online...
  play-reward: 8            # ...gives this many points

upgrade:
  max-level: 100
  costs: [25, 50, 100, 200, 400, 800, 1500, 3000, 6000, 12000] # price of levels 2-11; past that the price keeps growing on its own
  power-per-level: 0.10     # +10% range, damage and duration per level; levels past 50 count DOUBLE (level 100 is about 16x)
  cooldown-per-level: 0.01  # -1% cooldown per level
  min-cooldown-mult: 0.25   # cooldowns never go below 25% of the base

# Quest types: KILL_MOBS, KILL_PLAYERS, BREAK_LOGS, MINE_ORES, USE_POWER, COLLECT_CANDY,
#              DUEL_WIN, BOSS_KILL, RANKED_WIN, OPEN_CRATE, TRADE, REBIRTH
# A finished quest gives its points and starts over by itself.
quests:
  mob-slayer:
    name: "Mob Slayer"
    description: "Kill hostile mobs"
    type: KILL_MOBS
    target: 30
    reward: 12
  player-hunter:
    name: "Player Hunter"
    description: "Kill other players"
    type: KILL_PLAYERS
    target: 3
    reward: 20
  lumberjack:
    name: "Lumberjack"
    description: "Chop logs"
    type: BREAK_LOGS
    target: 32
    reward: 10
  deep-miner:
    name: "Deep Miner"
    description: "Mine ores"
    type: MINE_ORES
    target: 32
    reward: 18
  power-user:
    name: "Power User"
    description: "Use your power"
    type: USE_POWER
    target: 25
    reward: 10
  power-master:
    name: "Power Master"
    description: "Use your power a LOT"
    type: USE_POWER
    target: 100
    reward: 35
  horde-slayer:
    name: "Horde Slayer"
    description: "Kill a whole horde of hostile mobs"
    type: KILL_MOBS
    target: 150
    reward: 50
  candy-collector:
    name: "Candy Collector"
    description: "Collect candy on Trick or Treat Night"
    type: COLLECT_CANDY
    target: 20
    reward: 15

  duelist:
    name: "Duelist"
    description: "Win friendly duels"
    type: DUEL_WIN
    target: 3
    reward: 15
  horseman-slayer:
    name: "Horseman Slayer"
    description: "Defeat a boss (any boss counts)"
    type: BOSS_KILL
    target: 1
    reward: 25
  boss-hunter:
    name: "Boss Hunter"
    description: "Defeat bosses"
    type: BOSS_KILL
    target: 5
    reward: 40
  ranked-warrior:
    name: "Ranked Warrior"
    description: "Win ranked duels (/ranked)"
    type: RANKED_WIN
    target: 3
    reward: 30
  crate-opener:
    name: "Crate Opener"
    description: "Open Power Crates (/crate)"
    type: OPEN_CRATE
    target: 3
    reward: 20
  master-trader:
    name: "Master Trader"
    description: "Complete trades with other players (/trade)"
    type: TRADE
    target: 3
    reward: 20
  reborn-again:
    name: "Born Again"
    description: "Rebirth (/rebirth)"
    type: REBIRTH
    target: 1
    reward: 50

# ------------------------------------------------------------------
# Trick or Treat Night (admin panel button)
# ------------------------------------------------------------------
trickortreat:
  interval-seconds: 20
  max-huts: 20
  huts-per-player: 2
  cooldown-seconds: 20
  treat-chance: 0.7
  candy-per-coin: 5

# ------------------------------------------------------------------
# Headless Horseman boss: /boss fight Headless Horseman
# ------------------------------------------------------------------
horseman:
  health: 100
  rage-health: 25            # phase 3 (raging) starts at this health
  arena-x: 0
  arena-y: 200
  arena-z: -4000
  reward-points: 40
  reward-coins: 30
  gravestone-damage: 6
  pumpkin-damage: 8
  slash-damage: 6            # phase 3 doubles all of these

# ------------------------------------------------------------------
# All boss fights: every fight gets its OWN arena copy, spaced this many
# blocks apart along X, so nobody ever waits for an arena. Fighters hold a
# Fight Totem: if it pops they lose the fight, but they never die.
# A friend joins with /boss invite <player> + /boss accept.
# ------------------------------------------------------------------
boss:
  arena-slot-spacing: 100
  cooldown-seconds:       # v9: after a boss fight starts, that boss is on cooldown for you
    default: 300          # 5 minutes
    horseman: 300
    mimic: 600            # 10 minutes - he pays out the most
    ghost: 180            # 3 minutes - he is the easy boss

# ------------------------------------------------------------------
# Mimic boss: /boss fight Mimic. A giant chest monster.
# Phases: 100-75% tongue pull, 75-50% chomp (4 hearts + poison) and weaken,
# 50-25% spawns a copy of you, 25-0% ULTRA: 2 giant copies of you.
# ------------------------------------------------------------------
mimic:
  health: 300
  arena-x: 0
  arena-y: 200
  arena-z: -8000
  reward-coins: 100           # Halloween Coins
  reward-points: 0            # Unbound Coins
  bite-hearts: 3              # normal melee
  tongue-bite-hearts: 2       # bite after the tongue drags you in
  chomp-hearts: 4             # phase 2+ bite
  poison-seconds: 5
  weaken-seconds: 5
  giant-damage-hearts: 6      # the giant copies of you hit this hard (but die in 2 hits)

# ------------------------------------------------------------------
# Ghost boss: /boss fight Ghost. An easy boss: 20 hearts (40 HP).
# Visible for 5 seconds, invisible for 3 seconds (he sneaks behind you
# and hits you), then visible again, over and over.
# NOTE: this is the BOSS. The "ghost:" section higher up is the Ghost power.
# ------------------------------------------------------------------
ghost-boss:
  health: 40
  arena-x: 0
  arena-y: 200
  arena-z: 8000
  reward-coins: 10            # Halloween Coins
  reward-points: 5            # Unbound Coins
  damage-hearts: 2.5
  visible-seconds: 5
  invisible-seconds: 3

# ------------------------------------------------------------------
# Duels: /duel <player>, then the other player runs /duel accept
# ------------------------------------------------------------------
duel:
  arena-x: 0
  arena-y: 220
  arena-z: 4000
  win-points: 12
  countdown-seconds: 5
  max-minutes: 3
  allow-powers: false        # false = fair fights without powers
  reward-cooldown-minutes: 15  # no reward for beating the same player again too soon
  request-seconds: 60

# ------------------------------------------------------------------
# Ranks. Normal ranks upgrade by total playtime (minutes). Add more entries to continue upward.
# Halloween ranks are built in and are permanent once unlocked.
# ------------------------------------------------------------------
ranks:
  normal:
    new-here:
      name: "I'm New Here"
      minutes: 0
    noob:
      name: "Noob"
      minutes: 20
    unbound-pro:
      name: "Unbound Pro"
      minutes: 40
    unbound-veteran:
      name: "Unbound Veteran"
      minutes: 60
    unbound-expert:
      name: "Unbound Expert"
      minutes: 120
    unbound-king:
      name: "Unbound King"
      minutes: 160
  halloween:
    veteran-kills: 50
    expert-kills: 150

# ------------------------------------------------------------------
# Power Shop (/shop). Restocks on a timer. Every power costs Unbound Coins.
# A power with no price here is never sold. Admins can stock and discount powers from /panel.
# ------------------------------------------------------------------
shop:
  restock-minutes: 8
  items-per-restock: 5       # random powers on sale each restock
  stock-per-item: 2          # how many players can buy each power before it sells out
  prices:                    # priced by rarity now: Common ~50, Rare ~90, Epic ~155, Legendary ~255, Mythic ~425
    flame: 55
    feather: 50
    aqua: 55
    candy: 55
    healer: 80
    hunter: 85
    skeleton: 85
    spider: 85
    shadow: 95
    pumpkin: 95
    thor: 110
    witch: 150
    stealer: 150
    phantom: 150
    scarecrow: 155
    tank: 160
    werewolf: 165
    curse: 240
    teleporter: 250
    reaper: 260
    void: 275
    ghost: 400
    vampire: 450

