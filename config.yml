# ------------------------------------------------------------------
# Power Crates (v9): /crate. Right-click a crate with a key in your
# inventory to spin for a random power you do not own yet.
# weights: the rarity odds. boss-drops: your chance of a key (or a
# whole crate) when you beat each boss.
# ------------------------------------------------------------------
crates:
  weights:
    common: 50
    rare: 30
    epic: 13
    legendary: 5
    mythic: 2
  boss-drops:
    horseman-key-chance: 0.35
    horseman-crate-chance: 0.10
    mimic-key-chance: 1.0
    mimic-crate-chance: 0.50
    ghost-key-chance: 0.15
    ghost-crate-chance: 0.0

# ------------------------------------------------------------------
# Trading (v9): /trade <player>. Both players must confirm, and any
# change to an offer un-confirms both sides.
# ------------------------------------------------------------------
trading:
  request-seconds: 60
  timeout-seconds: 120

# ------------------------------------------------------------------
# Ranked duels (v9): /ranked. Queue for a random player, or fight a
# practice bot matched to your rank. Ladder: Bronze, Silver, Gold,
# Platinum, Diamond, Master, and the best rank: Unbound King (2600).
# You start at 1000 rating. Nobody dies and nobody loses items.
# ------------------------------------------------------------------
ranked:
  arena-x: 0
  arena-y: 230
  arena-z: 12000
  countdown-seconds: 3
  max-minutes: 5
  win-points: 10            # Unbound Coins for beating a real player
  bot-win-points: 5         # Unbound Coins for beating your practice bot

# ------------------------------------------------------------------
# Rebirths (v9): /rebirth. Resets your Unbound Coins and power levels;
# you keep your powers. Cost of rebirth N is base-cost x N x N, and you
# also need boss kills. Every rebirth pays you back forever.
# ------------------------------------------------------------------
rebirth:
  base-cost: 250
  boss-kills-per-rebirth: 3   # rebirth N needs 3 x N total boss kills
  coin-bonus-percent: 10      # +10% to ALL coins earned, per rebirth, forever
  halloween-coins-per-rebirth: 20   # times your new rebirth number

# ------------------------------------------------------------------
# Server events (v9): item rain amounts (per player, per drop).
# The events themselves live in /panel -> Server Events.
# ------------------------------------------------------------------
events:
  rain:
    tacos-per-drop: 3
    diamonds-per-drop: 1
    gold-per-drop: 2
    candy-per-drop: 3

# ------------------------------------------------------------------
# The GALACTIC UPDATE countdown (v9): /galactic.
# Change the date here, or in game: /galactic set 2026-11-01 13:00
# (times use the timezone below)
# ------------------------------------------------------------------
galactic:
  name: "Galactic Update"
  release: "2026-11-01 13:00"   # Sunday Nov 1 2026, 1:00 PM
  timezone: "America/Toronto"
