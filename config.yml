config-version: 6

# ------------------------------------------------------------------
# Powers: right-click with a sword to use your power.
# Power items (nether stars): right-click one to gain that power.
# ------------------------------------------------------------------
flame:
  cooldown: 8
  fireball-yield: 2.0

# Speed is the starter power: idle Speed I, super = Speed III burst
speed:
  cooldown: 30
  idle-level: 1
  super-level: 3
  super-seconds: 8

shadow:
  cooldown: 12
  range: 25

thor:
  cooldown: 10
  range: 30

hunter:
  cooldown: 12
  range: 25
  pull-strength: 1.6
  pull-up: 0.25

stealer:
  cooldown: 20
  range: 20
  duration: 15

feather:
  cooldown: 10
  launch-strength: 2.3

healer:
  cooldown: 25

aqua:
  cooldown: 14
  speed: 0.8
  duration-ticks: 40

tank:
  cooldown: 15
  stun-seconds: 3

ghost:
  cooldown: 30
  range: 20
  wither-seconds: 3
  hearts-stolen: 4
  invisibility-duration-seconds: 10
  glow-radius: 30
  steal-duration: 300       # seconds until stolen hearts return (0 = until death/quit)
  min-hearts-left: 1
  max-extra-hearts: 10      # most extra hearts a Ghost can hold from stealing (0 = no limit)

# Vampire: latch onto the nearest enemy (sneak to let go), drain them with fake blood, wither them.
vampire:
  cooldown: 25
  range: 20
  wither-seconds: 4
  wither-amplifier: 0
  leech-seconds: 5
  leech-per-pulse: 1.0      # HP taken from the enemy and given to you, 2 pulses per second

# Void: idle Strength III. Super: wither + big damage to the nearest enemy.
void:
  cooldown: 40
  range: 25
  wither-seconds: 5
  wither-amplifier: 1
  damage-hearts: 7

# Teleporter: dash to the nearest enemy, freeze them, fling them back, damage them.
teleporter:
  cooldown: 30
  range: 30
  dash-speed: 2.0
  freeze-ticks: 20
  fling-distance: 20        # blocks (walls and obstacles shorten it)
  damage-hearts: 4

# ------------------------------------------------------------------
# Chance weights used when someone rerolls their power:
# ------------------------------------------------------------------
drops:
  enabled: true
  flame: 0.20
  speed: 0.15
  tank: 0.03
  thor: 0.12
  shadow: 0.10
  healer: 0.08
  feather: 0.10
  stealer: 0.06
  aqua: 0.12
  hunter: 0.12
  ghost: 0.08
  vampire: 0.06
  teleporter: 0.04
  void: 0.05

# Reroll if the first power isn't the wanted one:
rerolling:
  enabled: true
  window-minutes: 10

# Potion-effect levels and idle settings:
passives:
  speed-level: 2
  thor-strength-level: 1
  stealer-haste-level: 1
  healer-regeneration-level: 2
  aqua-dolphins-grace-level: 1
  ghost-speed-level: 1
  teleporter-speed-level: 3
  void-strength-level: 3
  tank-extra-hearts: 4
  hunter-glow-radius: 30
  particles-enabled: true

# All enabled powers (delete to disable):
powers:
  enabled:
    - flame
    - speed
    - tank
    - thor
    - shadow
    - healer
    - feather
    - stealer
    - aqua
    - hunter
    - ghost
    - vampire
    - teleporter
    - void

# ------------------------------------------------------------------
# Who counts as an enemy for powers (targeting, glow, stun)
# ------------------------------------------------------------------
enemies:
  players: true
  hostile-mobs: true
  passive-mobs: false       # cows, pigs etc. (pets and villagers are never targeted)

# ------------------------------------------------------------------
# Reroll token: diamonds around a gold block. Right-click for a new random power.
# ------------------------------------------------------------------
reroll:
  recipe-enabled: true

# ------------------------------------------------------------------
# New player tutorial (/skip to skip, /tutorial to replay)
# ------------------------------------------------------------------
tutorial:
  enabled: true
  finish-reward: ["item:BREAD:8"]

# ------------------------------------------------------------------
# Admin panel (/panel): music tracks and Halloween events.
# Tracks are sound keys. Vanilla discs work out of the box. To use your own audio,
# add it to a resource pack (server.properties resource-pack=...) and put its sound key here,
# for example:  my-theme: "unbound:halloween_theme"
# Note: YouTube links can't be played by a server plugin.
# ------------------------------------------------------------------
music:
  tracks:
    disc-13: "minecraft:music_disc.13"
    disc-11: "minecraft:music_disc.11"
    cat: "minecraft:music_disc.cat"
    stal: "minecraft:music_disc.stal"
    pigstep: "minecraft:music_disc.pigstep"
    otherside: "minecraft:music_disc.otherside"
    disc-5: "minecraft:music_disc.5"
    cave-ambience: "minecraft:ambient.cave"

halloween:
  enabled: true      # false = portal, Haunted Forest mobs, boss and events are off. Ranks and progress stay.
  music: "minecraft:music_disc.13"
  music-length-seconds: 178
  curse-seconds: 60
  max-lanterns: 120
  lantern-interval-seconds: 5

# ------------------------------------------------------------------
# New players start with this power and a Power Activator sword
# ------------------------------------------------------------------
starter-power: speed

activator:
  required: true            # true = only the Power Activator sword uses powers, false = any sword

# ------------------------------------------------------------------
# Unbound points: earned from quests and playtime, spent at upgrade stations
# (an admin sets a station with /station add while looking at a block)
# ------------------------------------------------------------------
points:
  play-minutes: 20          # every 20 minutes online...
  play-reward: 10           # ...gives this many points

upgrade:
  max-level: 5
  costs: [25, 50, 100, 200] # price of level 2, 3, 4, 5
  power-per-level: 0.10     # +10% range, damage and duration per level
  cooldown-per-level: 0.10  # -10% cooldown per level

# Quest types: KILL_MOBS, KILL_PLAYERS, BREAK_LOGS, MINE_ORES, USE_POWER, COLLECT_CANDY,
#              KILL_HAUNTED, HAUNTED_MINUTES, DUEL_WIN, BOSS_KILL
# A finished quest gives its points and starts over by itself.
quests:
  mob-slayer:
    name: "Mob Slayer"
    description: "Kill hostile mobs"
    type: KILL_MOBS
    target: 20
    reward: 15
  player-hunter:
    name: "Player Hunter"
    description: "Kill other players"
    type: KILL_PLAYERS
    target: 3
    reward: 25
  lumberjack:
    name: "Lumberjack"
    description: "Chop logs"
    type: BREAK_LOGS
    target: 32
    reward: 10
  deep-miner:
    name: "Deep Miner"
    description: "Mine ores"
    type: MINE_ORES
    target: 24
    reward: 20
  power-user:
    name: "Power User"
    description: "Use your power"
    type: USE_POWER
    target: 15
    reward: 10
  candy-collector:
    name: "Candy Collector"
    description: "Collect candy on Trick or Treat Night"
    type: COLLECT_CANDY
    target: 20
    reward: 15

  haunted-hunter:
    name: "Haunted Hunter"
    description: "Defeat mobs in the Haunted Forest"
    type: KILL_HAUNTED
    target: 30
    reward: 20
  haunted-survivor:
    name: "Forest Survivor"
    description: "Spend minutes in the Haunted Forest"
    type: HAUNTED_MINUTES
    target: 10
    reward: 15
  duelist:
    name: "Duelist"
    description: "Win friendly duels"
    type: DUEL_WIN
    target: 2
    reward: 15
  horseman-slayer:
    name: "Horseman Slayer"
    description: "Defeat the Headless Horseman"
    type: BOSS_KILL
    target: 1
    reward: 30

# ------------------------------------------------------------------
# Trick or Treat Night (admin panel button)
# ------------------------------------------------------------------
trickortreat:
  interval-seconds: 20
  max-huts: 20
  huts-per-player: 2
  cooldown-seconds: 20
  treat-chance: 0.7
  candy-per-coin: 5

# ------------------------------------------------------------------
# Haunted Forest (Halloween dimension): portal = jack-o-lantern frame lit with flint and steel
# ------------------------------------------------------------------
haunted:
  world-name: haunted_forest
  coins-per-kill: 5          # Halloween Coins for every mob you defeat there
  mob-cap: 12                # custom mobs near each player
  hut-chance: 0.12           # chance that a new chunk gets a trick-or-treat hut
  chest-chance: 0.20         # chance that a new chunk gets a lone loot chest
  survive-minutes: 20        # for the Halloween Survivor / King ranks

# ------------------------------------------------------------------
# Headless Horseman boss: /boss fight Headless Horseman
# ------------------------------------------------------------------
horseman:
  health: 100
  rage-health: 25            # phase 3 (raging) starts at this health
  arena-x: 0
  arena-y: 200
  arena-z: -4000
  reward-points: 50
  reward-coins: 30
  gravestone-damage: 6
  pumpkin-damage: 8
  slash-damage: 6            # phase 3 doubles all of these

# ------------------------------------------------------------------
# Duels: /duel <player>, then the other player runs /duel accept
# ------------------------------------------------------------------
duel:
  arena-x: 0
  arena-y: 220
  arena-z: 4000
  win-points: 15
  countdown-seconds: 5
  max-minutes: 3
  allow-powers: false        # false = fair fights without powers
  reward-cooldown-minutes: 10  # no reward for beating the same player again too soon
  request-seconds: 60

# ------------------------------------------------------------------
# Ranks. Normal ranks upgrade by total playtime (minutes). Add more entries to continue upward.
# Halloween ranks are built in and are permanent once unlocked.
# ------------------------------------------------------------------
ranks:
  normal:
    new-here:
      name: "I'm New Here"
      minutes: 0
    noob:
      name: "Noob"
      minutes: 20
    unbound-pro:
      name: "Unbound Pro"
      minutes: 40
    unbound-veteran:
      name: "Unbound Veteran"
      minutes: 60
    unbound-expert:
      name: "Unbound Expert"
      minutes: 120
    unbound-king:
      name: "Unbound King"
      minutes: 160
  halloween:
    veteran-kills: 50
    expert-kills: 150

# ------------------------------------------------------------------
# Power shop (/shop). prices = Unbound points, coin-prices = Halloween Coins.
# A power with no price is not for sale.
# ------------------------------------------------------------------
shop:
  prices:
    flame: 40
    feather: 40
    aqua: 50
    healer: 60
    hunter: 60
    shadow: 70
    stealer: 80
    thor: 100
    tank: 100
    teleporter: 150
    void: 150
  coin-prices:
    ghost: 80
    vampire: 100
