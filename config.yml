config-version: 10

# ------------------------------------------------------------------
# Powers: right-click with a sword to use your power.
# Power items (nether stars): right-click one to gain that power.
# ------------------------------------------------------------------
flame:
  cooldown: 8
  fireball-yield: 2.0

# Speed is the starter power: idle Speed I, super = Speed III burst
speed:
  cooldown: 30
  idle-level: 1
  super-level: 3
  super-seconds: 8

shadow:
  cooldown: 12
  range: 25

thor:
  cooldown: 10
  range: 30

hunter:
  cooldown: 12
  range: 25
  pull-strength: 1.6
  pull-up: 0.25

stealer:
  cooldown: 20
  range: 20
  duration: 15

feather:
  cooldown: 10
  launch-strength: 2.3

healer:
  cooldown: 25

aqua:
  cooldown: 14
  speed: 0.8
  duration-ticks: 40

tank:
  cooldown: 15
  stun-seconds: 3

ghost:
  cooldown: 30
  range: 20
  wither-seconds: 3
  hearts-stolen: 4
  invisibility-duration-seconds: 10
  glow-radius: 30
  steal-duration: 300       # seconds until stolen hearts return (0 = until death/quit)
  min-hearts-left: 1
  max-extra-hearts: 10      # most extra hearts a Ghost can hold from stealing (0 = no limit)

# Vampire: latch onto the nearest enemy (sneak to let go), drain them with fake blood, wither them.
vampire:
  cooldown: 25
  range: 20
  wither-seconds: 4
  wither-amplifier: 0
  leech-seconds: 5
  leech-per-pulse: 1.0      # HP taken from the enemy and given to you, 2 pulses per second

# Void: idle Strength III. Super: wither + big damage to the nearest enemy.
void:
  cooldown: 40
  range: 25
  wither-seconds: 5
  wither-amplifier: 1
  damage-hearts: 7

# Teleporter: dash to the nearest enemy, freeze them, fling them back, damage them.
teleporter:
  cooldown: 30
  range: 30
  dash-speed: 2.0
  freeze-ticks: 20
  fling-distance: 20        # blocks (walls and obstacles shorten it)
  damage-hearts: 4

# ------------------------------------------------------------------
# Halloween powers (v8): Pumpkin, Witch, Skeleton, Spider, Scarecrow,
# Reaper, Candy, Phantom, Werewolf, Curse. RETIRED in v10: players who
# own them keep them forever, but they are no longer sold or rolled.
# ------------------------------------------------------------------
pumpkin:
  cooldown: 18
  fireball-yield: 3.5

witch:
  cooldown: 25
  range: 10
  poison-seconds: 6

skeleton:
  cooldown: 16
  range: 30
  arrows: 8
  arrow-damage: 4.0         # 2 hearts per arrow

spider:
  cooldown: 20
  range: 20
  poison-seconds: 5
  web-seconds: 5

scarecrow:
  cooldown: 22
  range: 9
  fear-seconds: 6

reaper:
  cooldown: 20
  range: 25
  damage-hearts: 5
  heal-hearts: 2.5

candy:
  cooldown: 24
  buff-seconds: 10
  heal-hearts: 4

phantom:
  cooldown: 18
  dash-strength: 1.8
  range: 7
  damage-hearts: 2

werewolf:
  cooldown: 26
  buff-seconds: 12
  range: 10

curse:
  cooldown: 24
  range: 22
  curse-seconds: 8

# ------------------------------------------------------------------
# Galactic powers (v10): the four headliners
# ------------------------------------------------------------------
# Supernova: idle Fire Resistance. Super: 3 fireballs at the nearest enemy.
supernova:
  cooldown: 20
  range: 40
  fireballs: 3
  fireball-yield: 1.8

# Earth: idle Resistance II. Super: a stone box traps your enemy, you get
# Strength III and minions hunt only them. Lasts 1 minute, cooldown 5 minutes.
earth:
  cooldown: 300
  range: 30
  duration-seconds: 60
  minions: 4
  box-material: STONE

# Wind: ONLY ONE EXISTS and it only comes from admin commands (/power set wind).
# Idle: no fall damage. Super: charge in the air 2s, then slam for 15 hearts in 15 blocks.
wind:
  cooldown: 60
  radius: 15
  damage-hearts: 15
  limited: true

# Frost: idle Frost Walker (water freezes under your feet). Super: freeze every
# enemy in 30 blocks for 5s, then frost damage bites them for 20s.
frost:
  cooldown: 90
  radius: 30
  freeze-seconds: 5
  damage-seconds: 20
  damage-per-pulse: 1.0     # HP every 2 seconds while the frost bites (before upgrade multiplier)
  walk-radius: 2

# ------------------------------------------------------------------
# Galactic powers (v10): fifteen more
# ------------------------------------------------------------------
starlight:
  cooldown: 12
  range: 35
  damage-hearts: 3.5

comet:
  cooldown: 14
  dash-strength: 2.4
  damage-hearts: 2

meteor:
  cooldown: 25
  range: 45
  yield: 3.0

lunar:
  cooldown: 30
  range: 12
  duration-seconds: 15

pulsar:
  cooldown: 35
  range: 9
  damage-hearts: 1.5

nebula:
  cooldown: 40
  range: 8
  duration-seconds: 10

solar-flare:
  cooldown: 45
  range: 15
  blind-seconds: 5
  damage-hearts: 2

eclipse:
  cooldown: 50
  range: 20
  duration-seconds: 10

asteroid:
  cooldown: 40
  range: 35
  damage-hearts: 6
  impact-radius: 5
  orbit-radius: 3.2
  orbit-damage: 1.0         # HP per second to enemies standing too close

zero-gravity:
  cooldown: 55
  range: 14
  float-seconds: 6
  slam-hearts: 3

wormhole:
  cooldown: 45
  range: 40

quasar:
  cooldown: 60
  range: 30
  width: 2.2
  damage-hearts: 8

black-hole:
  cooldown: 90
  range: 30
  duration-seconds: 6
  pull-radius: 12
  burst-hearts: 4

antimatter:
  cooldown: 120
  radius: 12
  damage-hearts: 10

rocket:
  cooldown: 18
  launch-strength: 2.6
  fall-seconds: 10

# ------------------------------------------------------------------
# Chance weights used when someone rerolls their power:
# (retired Halloween powers and the Wind power never roll)
# ------------------------------------------------------------------
drops:
  enabled: true
  flame: 0.20
  speed: 0.15
  tank: 0.03
  thor: 0.12
  shadow: 0.10
  healer: 0.08
  feather: 0.10
  stealer: 0.06
  aqua: 0.12
  hunter: 0.12
  ghost: 0.08
  vampire: 0.06
  teleporter: 0.04
  void: 0.05
  pumpkin: 0.07
  witch: 0.06
  skeleton: 0.07
  spider: 0.07
  scarecrow: 0.06
  reaper: 0.04
  candy: 0.08
  phantom: 0.06
  werewolf: 0.05
  curse: 0.05
  supernova: 0.03
  earth: 0.01
  frost: 0.03
  starlight: 0.14
  comet: 0.09
  meteor: 0.08
  lunar: 0.09
  pulsar: 0.05
  nebula: 0.05
  solar-flare: 0.05
  eclipse: 0.04
  asteroid: 0.03
  zero-gravity: 0.03
  wormhole: 0.03
  quasar: 0.02
  black-hole: 0.01
  antimatter: 0.01
  rocket: 0.13

# Reroll if the first power isn't the wanted one:
rerolling:
  enabled: true
  window-minutes: 10

# Potion-effect levels and idle settings:
passives:
  speed-level: 2
  thor-strength-level: 1
  stealer-haste-level: 1
  healer-regeneration-level: 2
  aqua-dolphins-grace-level: 1
  ghost-speed-level: 1
  teleporter-speed-level: 3
  void-strength-level: 3
  werewolf-speed-level: 1
  tank-extra-hearts: 4
  hunter-glow-radius: 30
  particles-enabled: true

# All enabled powers (delete to disable):
powers:
  enabled:
    - flame
    - speed
    - tank
    - thor
    - shadow
    - healer
    - feather
    - stealer
    - aqua
    - hunter
    - ghost
    - vampire
    - teleporter
    - void
    - pumpkin
    - witch
    - skeleton
    - spider
    - scarecrow
    - reaper
    - candy
    - phantom
    - werewolf
    - curse
    - supernova
    - earth
    - wind
    - frost
