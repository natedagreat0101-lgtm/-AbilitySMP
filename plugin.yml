name: AbilitySMP
version: 16.0
main: me.abilitysmp.AbilitySMP
api-version: '1.21'
description: Unbound SMP - powers, 50 hidden mixed powers and the Mixing Pot, the Galaxy Burst space event, the hotbar-style power bar, a DonutSMP-style spawn, six galaxy bosses, a random daily Item Shop, music, crates, ranked duels, trading, rebirths, quests, tutorial, admin panel and galaxy events
commands:
  power:
    description: Give or remove a power (admin)
    usage: /power <give|set|take|list|token|points|reload> ...
    permission: abilitysmp.admin
  panel:
    description: Open the admin panel
    usage: /panel
    permission: abilitysmp.admin
  station:
    description: Make the block you look at an upgrade station
    usage: /station <add|remove|list>
    permission: abilitysmp.admin
  upgrade:
    description: Open the upgrade menu anywhere (admin)
    usage: /upgrade
    permission: abilitysmp.admin
  reroll:
    description: Reroll your power (only right after you first join)
    usage: /reroll
  activator:
    description: Get a new Power Activator sword if you lost yours
    usage: /activator
  points:
    description: Show your Unbound Coins
    usage: /points
  quests:
    description: Show your quests
    usage: /quests
  notes:
    description: Patch notes and how to use new features
    usage: /notes [all]
  skip:
    description: Skip the tutorial
    usage: /skip
  tutorial:
    description: Replay the tutorial
    usage: /tutorial
  powers:
    description: Open the power menu to equip your powers
    usage: /powers
  shop:
    description: Buy powers (the stock restocks every few minutes)
    usage: /shop
  crate:
    description: Power Crates - see your crates and keys, or (admin) give them / set a spawn crate chest
    usage: /crate [give|key <player> [amount]] or /crate set|unset
  trade:
    description: Trade items safely with another player (both players confirm)
    usage: /trade <player|accept|deny|cancel>
  ranked:
    description: Ranked duels - fight a random player or a bot matched to your rank and climb to Unbound King
    usage: /ranked [queue|bot|impossible|leave]
  rebirth:
    description: Rebirth - reset your coins and power levels for permanent bonuses
    usage: /rebirth [confirm]
  spawn:
    description: Teleport to the spawn
    usage: /spawn
  setspawn:
    description: Set the spawn point where you stand (admin)
    usage: /setspawn
  spawnnpc:
    description: Place a spawn NPC or the countdown board (admin)
    usage: /spawnnpc <rtp|shop|event|ranked|duels|board|remove>
  spawnbuild:
    description: Build a ready-made DonutSMP-style spawn platform with NPCs, crate chests and the countdown board (admin)
    usage: /spawnbuild
  rtp:
    description: Random teleport into the wild
    usage: /rtp
  galactic:
    description: The Galactic Update is out! (admins can move the date for the next event)
    usage: /galactic [set 2026-11-01 13:00]
  locker:
    description: Your permanent collection - ranks, trails and more
    usage: /locker
  duel:
    description: Challenge a player to a friendly duel
    usage: /duel <player|accept|deny>
  boss:
    description: Fight a boss, or invite a friend to join your boss fights
    usage: /boss [fight <notazombiemc|astronout|comet-knight|solar-titan|void-serpent|eclipse-reaper>] | /boss invite <player> | /boss accept | /boss leave
  itemshop:
    description: The Item Shop - a new random shelf of items every day, sometimes OP
    usage: /itemshop
  season:
    description: The 1 Month Celebration season - this week's age, what is unlocked, and OP week controls
    usage: /season [set <1-5>|clear|start <yyyy-mm-dd>]
  mixingpot:
    description: About the Mixing Pot - mix two powers into a mixed power (OPs can give one)
    usage: /mixingpot [give]
  music:
    description: Your personal music player - music discs and Power Pack songs, only you hear it
    usage: /music [list|stop|play <song>]
  weapons:
    description: See all 14 legendary weapons - one goes on sale in the Item Shop each day
    usage: /weapons
  pay:
    description: Pay another player Unbound Coins or Galaxy Coins
    usage: /pay <player> <amount> <unbound|galaxy>
  playershop:
    description: Buy and sell items with other players
    usage: /playershop [mine|sell <price> [unbound|galaxy]]
  sell:
    description: Sell items from a sell box for Unbound Coins or Galaxy Coins
    usage: /sell
  sidebar:
    description: Show or hide your sidebar (coins, deaths, kills, playtime)
    usage: /sidebar
  afk:
    description: Go AFK and earn Unbound Coins every minute you are away
    usage: /afk
  tradeplayer:
    description: Trade with another player (same as /trade, use this if /trade is taken by another plugin)
    usage: /tradeplayer <player>
  staffrank:
    description: Give a staff rank (Mod, Tester, Co-Owner) - only an OP can do this
    usage: /staffrank <player> <mod|tester|co-owner|none>
  shopkeeper:
    description: Give shopkeeper spawn eggs or remove a shopkeeper (admin)
    usage: /shopkeeper egg <power|galaxy> [player] [amount]
    permission: abilitysmp.admin
permissions:
  abilitysmp.admin:
    default: op
